name: Release npm packages

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    if: github.repository == 'Ryfter/canvas-toolchain'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # No registry-url here: it writes an `_authToken=${NODE_AUTH_TOKEN}` line
      # into .npmrc which, with the env var unset, makes npm attempt classic
      # auth with an empty token instead of the OIDC exchange (E401).
      # See https://github.com/actions/setup-node/issues/1551
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Verify tag matches package versions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const tag = (process.env.GITHUB_REF_NAME || '').replace(/^v/, '');
          if (!tag) {
            console.error('GITHUB_REF_NAME is empty or missing');
            process.exit(1);
          }

          const offenders = [];
          const depFields = [
            'dependencies',
            'devDependencies',
            'optionalDependencies',
            'peerDependencies',
          ];
          const isIntraWorkspace = (name) =>
            name === 'canvas-toolchain' || name.startsWith('@canvas-toolchain/');

          const packagesDir = path.join(process.cwd(), 'packages');
          const workspaceManifests = fs
            .readdirSync(packagesDir, { withFileTypes: true })
            .filter((d) => d.isDirectory())
            .map((d) => path.join(packagesDir, d.name, 'package.json'))
            .filter((p) => fs.existsSync(p));

          // Root monorepo version must also match the tag.
          const rootPath = path.join(process.cwd(), 'package.json');
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          if (root.version !== tag) {
            offenders.push(
              `VERSION: package.json (root monorepo) version=${root.version} (expected exact ${tag})`,
            );
          }

          let checkedWorkspaces = 0;
          for (const manifestPath of workspaceManifests) {
            const rel = path.relative(process.cwd(), manifestPath).replace(/\\/g, '/');
            const pkg = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            // Channel modules (and any other private workspace) version independently
            // of the toolchain tag and are never npm-published. Skip their package
            // version; they must also not appear as intra-workspace dep pins elsewhere.
            if (pkg.private === true) {
              continue;
            }
            checkedWorkspaces += 1;
            if (pkg.version !== tag) {
              offenders.push(
                `VERSION: ${rel} name=${pkg.name ?? '(missing)'} version=${pkg.version ?? '(missing)'} (expected exact ${tag})`,
              );
            }
            for (const field of depFields) {
              const deps = pkg[field];
              if (!deps || typeof deps !== 'object') continue;
              for (const [name, range] of Object.entries(deps)) {
                if (!isIntraWorkspace(name)) continue;
                if (range !== tag) {
                  offenders.push(
                    `DEP: ${rel} ${field}["${name}"]="${range}" (expected exact "${tag}", not '*' or any range)`,
                  );
                }
              }
            }
          }

          if (offenders.length > 0) {
            console.error(
              `Tag v${tag} version guard failed (${offenders.length} offender(s)):`,
            );
            for (const line of offenders) console.error(`  - ${line}`);
            process.exit(1);
          }

          console.log(
            `OK: all publishable workspace package versions and intra-workspace dep pins match tag v${tag} (${checkedWorkspaces} workspaces; private workspaces skipped)`,
          );
          NODE

      - name: Install (builds via prepare)
        run: npm ci

      - name: Test
        run: npm test

      # Auth via npm Trusted Publishing (OIDC): no token, provenance is automatic.
      # Each package must have a Trusted Publisher configured on npmjs.com
      # pointing at this repo and workflow filename (release-npm.yml).
      #
      # Publishes one workspace at a time instead of `npm publish --workspaces`:
      # versions already on the registry are skipped and per-package failures
      # don't abort the rest, so a partially-failed release can be re-run.
      - name: Publish all workspaces (idempotent)
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';
          import path from 'node:path';

          const packagesDir = 'packages';
          const failures = [];
          const dirs = fs
            .readdirSync(packagesDir, { withFileTypes: true })
            .filter((d) => d.isDirectory())
            .map((d) => path.join(packagesDir, d.name))
            .filter((p) => fs.existsSync(path.join(p, 'package.json')));

          for (const dir of dirs) {
            const pkg = JSON.parse(fs.readFileSync(path.join(dir, 'package.json'), 'utf8'));
            if (pkg.private === true) continue;
            const spec = `${pkg.name}@${pkg.version}`;
            let published = '';
            try {
              published = execFileSync('npm', ['view', spec, 'version'], { stdio: ['ignore', 'pipe', 'pipe'] })
                .toString().trim();
            } catch {
              // E404: package has never been published; proceed.
            }
            if (published === pkg.version) {
              console.log(`SKIP ${spec} (already on registry)`);
              continue;
            }
            console.log(`PUBLISH ${spec}`);
            try {
              execFileSync('npm', ['publish', '--access', 'public', '--workspace', pkg.name], { stdio: 'inherit' });
            } catch {
              failures.push(spec);
            }
          }

          if (failures.length > 0) {
            console.error(`FAILED to publish ${failures.length} package(s): ${failures.join(', ')}`);
            process.exit(1);
          }
          console.log('All publishable workspaces are on the registry at the tagged version.');
          NODE
