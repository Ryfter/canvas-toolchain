name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    name: Build, test, smoke (TypeScript, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 = engines floor (setup-node '20' resolves to the latest 20.x, >= 20.19);
        # 24 = the runtime bundled by the installer; 26 = current.
        # Node 18 is NOT supported: cheerio -> undici 7 requires the global
        # File API, which landed in Node 20.
        node: ['20', '24', '26']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Institution scrub guard
        run: node scripts/check-institution-scrub.mjs

      - name: App-home path guard
        run: |
          node scripts/check-app-paths.mjs
          node scripts/check-app-paths.mjs --self-test

      - name: Build all packages
        run: npm run build

      # Both skill-graph checks read the built registry
      # (packages/command-and-control/dist/surface/registry.js), so they must stay
      # below "Build all packages". They are pure filesystem reads, so they run on
      # one matrix node only. If Node 20 ever leaves the matrix, move the gate with
      # it — a gate on a version that is gone silently stops running the check.
      - name: Skill graph is up to date
        if: matrix.node == '20'
        run: |
          node scripts/skills/build-index.mjs --check
          node scripts/skills/moc.mjs --check

      - name: Skill graph lint
        if: matrix.node == '20'
        run: node scripts/skills/lint.mjs

      - name: Run full test suite
        run: npm test

      - name: Cross-app integration smoke
        run: npm run smoke:integration --workspace=packages/command-and-control

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  module-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Runs BEFORE verify:modules on purpose. Actions halts a job at its first failed
      # step, and verify:modules is deliberately red until the post-release catalog
      # cutover — so ordering it first would leave this drift gate unreachable, and
      # silently unprotecting docs/modules.md, for the whole interim.
      - name: Verify docs/modules.md is regenerated from the catalog
        run: |
          npm run docs:modules
          git diff --exit-code docs/modules.md

      - name: Verify committed module artifacts match the source and the catalog
        run: npm run verify:modules

  from-source-onboarding:
    name: npx canvas-toolchain from a fresh copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # Mirror a colleague's real folder: spaces and parentheses in the path.
      - name: Copy tree to a hostile path and install
        run: |
          DEST="$RUNNER_TEMP/Canvas Toolchain (Copy)/canvas-toolchain"
          mkdir -p "$DEST"
          git archive HEAD | tar -x -C "$DEST"
          cd "$DEST"
          npm install
          node scripts/smoke-npx.mjs npx canvas-toolchain

  # CT200-10: the path-and-credential tests must hold on every OS the professor
  # might run on. This runs a NAMED SUBSET, not `npm test`: the full TypeScript
  # suite on Windows has known failures unrelated to this work (issue #200,
  # CT200-00 discovery), so a whole-suite Windows job would be permanently red
  # and teach everyone to ignore it. Do not widen this to `npm test` or add
  # continue-on-error; add files to the subset as they are proven green.
  cross-os:
    name: Path and credential tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      # Whole suites: these packages hold the resolver, migration, credential
      # store, remap and canvas-store tests (shared-types) and the module guards.
      - name: Shared and module packages (whole suites)
        run: |
          for ws in shared-types module-contract module-group-builder module-roster \
                    module-peerassessment module-oral-assessment module-video module-announcements; do
            npm test --workspace=packages/$ws
          done

      - name: Curriculum Intelligence and Design Studio (path and config tests)
        run: |
          npm test --workspace=packages/curriculum-intelligence -- \
            tests/config.test.ts tests/kb tests/parsers tests/tools/setup_course.test.ts
          npm test --workspace=packages/canvas-design-studio -- \
            tests/app-paths-redirect.test.ts tests/canvas-store-bridge.test.ts \
            tests/config.test.ts tests/config-atomic.test.ts tests/setup-course.test.ts \
            tests/page-io.test.ts tests/course-config.test.ts

      # Command & Control: only the setup, path, credential, channel, module and
      # surface/skills files that do not shell out. The negative -t pattern skips
      # the one subset test known to fail on Windows for reasons unrelated to
      # paths (issue #200, CT200-00): "surfaces only booleans and our own script
      # path" in tests/setup/hosts.test.ts. The other known failure, "repairs a
      # stale generated region" (tests/skills/build-index.test.ts), is simply not
      # in this subset because that file shells out.
      - name: Command and Control (named subset)
        run: |
          npm test --workspace=packages/command-and-control -- \
            -t '^(?!.*surfaces only booleans and our own script path).*$' \
            tests/setup tests/kb tests/channel tests/modules \
            tests/channel-catalog.test.ts tests/channel-install.test.ts \
            tests/channel-loader.test.ts tests/channel-notices.test.ts \
            tests/channel-stores.test.ts tests/module-channel-tools.test.ts \
            tests/surface-registry.test.ts tests/surface-sections.test.ts \
            tests/surface-invariants.test.ts tests/surface-intents.test.ts \
            tests/skills/emit.test.ts tests/skills/frontmatter.test.ts \
            tests/skills/graph.test.ts tests/skills/lint.test.ts tests/skills/related.test.ts
