name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    name: Build, test, smoke (TypeScript, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 = engines floor; 24 = the runtime bundled by the installer.
        # Node 18 is NOT supported: cheerio -> undici 7 requires the global
        # File API, which landed in Node 20.
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Run full test suite
        run: npm test

      - name: Cross-app integration smoke
        run: npm run smoke:integration --workspace=packages/command-and-control

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
